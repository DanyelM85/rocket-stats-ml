<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay OBS - The Community League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Rajdhani:wght@600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --team-blue: #0088ff;
        --team-blue-dark: #0044bb;
        --team-blue-glow: rgba(0, 136, 255, 0.7);
        --team-orange: #ff6600;
        --team-orange-dark: #cc3300;
        --team-orange-glow: rgba(255, 102, 0, 0.7);
        --panel-bg: rgba(6, 10, 18, 0.88);
        --panel-border: rgba(255, 255, 255, 0.14);
        --active-color: var(--team-blue);
        --active-glow: var(--team-blue-glow);
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
        font-family: 'Rajdhani', sans-serif;
        overflow: hidden;
        color: #fff;
        user-select: none;
    }

    * { box-sizing: border-box; }

    /* Glassmorphism Esports Base */
    .glass-panel {
        background: var(--panel-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--panel-border);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75);
    }

    /* Keyframes de animación */
    @keyframes pulseGlow {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
    }

    @keyframes scoreFlash {
        0% { transform: scale(1); filter: brightness(1); }
        40% { transform: scale(1.3); filter: brightness(2) drop-shadow(0 0 20px #fff); }
        100% { transform: scale(1); filter: brightness(1); }
    }

    @keyframes demoStrobe {
        0%, 100% { opacity: 1; background: rgba(239, 68, 68, 0.9); }
        50% { opacity: 0.4; background: rgba(239, 68, 68, 0.3); }
    }

    @keyframes supersonicRing {
        0% { box-shadow: 0 0 12px #00f0ff, inset 0 0 8px #00f0ff; transform: scale(1); }
        50% { box-shadow: 0 0 30px #00f0ff, inset 0 0 18px #00f0ff; transform: scale(1.05); }
        100% { box-shadow: 0 0 12px #00f0ff, inset 0 0 8px #00f0ff; transform: scale(1); }
    }

    /* ---------- SCOREBUG CENTRAL ESTILO RLCS ---------- */
    #scorebug-container {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 100;
    }

    /* Tournament & Series Header Bar */
    #tournament-header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 4px;
        background: rgba(4, 7, 13, 0.94);
        padding: 4px 20px;
        border-radius: 6px 6px 0 0;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-bottom: none;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    #league-badge {
        font-family: 'Chakra Petch', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #f1f5f9;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    #league-badge::before, #league-badge::after {
        content: '';
        width: 16px;
        height: 2px;
        background: var(--active-color, #0088ff);
        box-shadow: 0 0 8px var(--active-color, #0088ff);
    }

    #series-info {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: #cbd5e1;
        border-left: 1px solid rgba(255,255,255,0.15);
        padding-left: 12px;
    }

    .pip-container {
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .pip-dot {
        width: 12px;
        height: 10px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        transform: skewX(-22deg);
        transition: all 0.3s ease;
    }
    .pip-dot.active-blue {
        background: var(--team-blue);
        border-color: #38bdf8;
        box-shadow: 0 0 10px var(--team-blue-glow);
    }
    .pip-dot.active-orange {
        background: var(--team-orange);
        border-color: #fb923c;
        box-shadow: 0 0 10px var(--team-orange-glow);
    }

    /* Scorebug Main Bar */
    #scorebug {
        display: flex;
        align-items: stretch;
        height: 56px;
        min-width: 580px;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
    }

    .team-block {
        flex: 1;
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 14px;
        font-family: 'Chakra Petch', sans-serif;
        font-size: 24px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        position: relative;
        overflow: hidden;
        z-index: 1;
    }

    .team-block.blue {
        justify-content: flex-end;
        text-align: right;
        background: linear-gradient(90deg, rgba(0, 136, 255, 0.7) 0%, rgba(0, 68, 187, 0.25) 100%);
        border-right: 3px solid rgba(0, 136, 255, 0.5);
    }

    .team-block.orange {
        justify-content: flex-start;
        text-align: left;
        background: linear-gradient(270deg, rgba(255, 102, 0, 0.7) 0%, rgba(204, 51, 0, 0.25) 100%);
        border-left: 3px solid rgba(255, 102, 0, 0.5);
    }

    .team-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    .team-logo {
        width: 36px;
        height: 36px;
        object-fit: contain;
        filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7));
        display: none;
    }

    /* Center Score & Timer Section */
    .score-center {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(3, 6, 12, 0.96);
        padding: 0 18px;
        min-width: 150px;
        gap: 12px;
        border-left: 1px solid rgba(255,255,255,0.1);
        border-right: 1px solid rgba(255,255,255,0.1);
        z-index: 2;
    }

    .score-num {
        font-family: 'Teko', sans-serif;
        font-size: 44px;
        font-weight: 700;
        line-height: 0.9;
        min-width: 32px;
        text-align: center;
        color: #fff;
        text-shadow: 0 0 12px rgba(255,255,255,0.4);
    }

    .score-num.flash {
        animation: scoreFlash 0.6s ease-out;
    }

    .score-divider {
        font-family: 'Teko', sans-serif;
        font-size: 28px;
        color: rgba(255,255,255,0.3);
        margin-top: -4px;
    }

    #timer-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 78px;
        background: rgba(15, 23, 42, 0.92);
        padding: 0 14px;
        border-left: 1px solid rgba(255,255,255,0.1);
    }

    #timer {
        font-family: 'Teko', sans-serif;
        font-size: 34px;
        font-weight: 700;
        line-height: 0.9;
        color: #f8fafc;
        letter-spacing: 1px;
    }

    #overtime-tag {
        font-family: 'Chakra Petch', sans-serif;
        font-size: 9px;
        font-weight: 700;
        color: #ef4444;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        display: none;
        margin-top: -2px;
        animation: pulseGlow 1.2s infinite ease-in-out;
    }

    /* ---------- ROSTERS LATERALES PRO RLCS ---------- */
    .roster {
        position: absolute;
        top: 90px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 240px;
        padding: 8px;
        border-radius: 6px;
        z-index: 90;
    }

    #roster-blue {
        left: 18px;
        border-left: 4px solid var(--team-blue);
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
    }

    #roster-orange {
        right: 18px;
        border-right: 4px solid var(--team-orange);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }

    .roster-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        transition: all 0.25s ease;
        position: relative;
    }

    .roster-row.active-spectate {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.45);
        box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.2);
    }

    #roster-blue .roster-row.active-spectate {
        border-left: 4px solid #38bdf8;
    }

    #roster-orange .roster-row.active-spectate {
        border-right: 4px solid #fb923c;
    }

    .spectate-icon {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00f0ff;
        box-shadow: 0 0 8px #00f0ff;
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    .roster-row.active-spectate .spectate-icon {
        opacity: 1;
    }

    .roster-player-name {
        flex: 1;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: 0.5px;
    }

    .roster-boost-bar-wrap {
        width: 60px;
        height: 9px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 2px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .roster-boost-fill {
        height: 100%;
        width: 0%;
        background: #00f0ff;
        transition: width 0.2s ease, background-color 0.2s ease;
    }

    .roster-boost-num {
        font-family: 'Teko', sans-serif;
        font-size: 18px;
        font-weight: 700;
        width: 32px;
        text-align: right;
        color: #cbd5e1;
        line-height: 1;
    }

    .roster-demo-badge {
        display: none;
        font-family: 'Chakra Petch', sans-serif;
        font-size: 9px;
        font-weight: 700;
        color: #fff;
        padding: 1px 5px;
        border-radius: 2px;
        letter-spacing: 1px;
        animation: demoStrobe 0.8s infinite;
    }

    .roster-row.demoed {
        opacity: 0.45;
    }

    .roster-row.demoed .roster-demo-badge {
        display: block;
    }

    .roster-row.demoed .roster-boost-bar-wrap,
    .roster-row.demoed .roster-boost-num {
        display: none;
    }

    /* ---------- HUD JUGADOR ESPECTADO (BOTTOM LEFT) ---------- */
    #active-player-card {
        position: absolute;
        bottom: 22px;
        left: 22px;
        min-width: 340px;
        padding: 14px 20px;
        border-radius: 8px;
        border-left: 5px solid var(--active-color, var(--team-blue));
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.35s ease, transform 0.35s ease;
        z-index: 90;
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
    }

    #active-player-card.visible {
        opacity: 1;
        transform: translateY(0);
    }

    #active-player-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        padding-bottom: 6px;
    }

    #active-player-name {
        font-family: 'Chakra Petch', sans-serif;
        font-size: 22px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    #active-player-team-tag {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 2px;
        padding: 2px 10px;
        border-radius: 4px;
        background: var(--active-color, var(--team-blue));
        color: #fff;
        text-transform: uppercase;
    }

    .active-stats-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        text-align: center;
    }

    .stat-box {
        display: flex;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.4);
        padding: 5px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stat-label {
        font-size: 9px;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .stat-value {
        font-family: 'Teko', sans-serif;
        font-size: 24px;
        font-weight: 700;
        line-height: 1;
        color: #fff;
    }

    /* Telemetría de Mando */
    #gamepad-hud {
        display: none;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px dashed rgba(255,255,255,0.12);
    }
    #gamepad-hud.active { display: flex; }

    .gp-bar-wrap {
        flex: 1;
        height: 6px;
        background: rgba(0,0,0,0.6);
        border-radius: 3px;
        overflow: hidden;
    }
    .gp-bar-fill {
        height: 100%;
        width: 50%;
        background: #38bdf8;
        transition: width 0.08s linear;
    }
    .gp-btn {
        font-size: 9px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 3px;
        background: rgba(255,255,255,0.12);
        color: #64748b;
    }
    .gp-btn.pressed {
        background: #22c55e;
        color: #fff;
        box-shadow: 0 0 8px #22c55e;
    }

    /* ---------- MEDIDOR DE BOOST CIRCULAR + VELOCIMETRO ---------- */
    #boost-meter-container {
        position: absolute;
        bottom: 22px;
        right: 22px;
        width: 126px;
        height: 126px;
        opacity: 0;
        transform: scale(0.9);
        transition: opacity 0.35s ease, transform 0.35s ease;
        z-index: 90;
    }

    #boost-meter-container.visible {
        opacity: 1;
        transform: scale(1);
    }

    #boost-meter-svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
        filter: drop-shadow(0 6px 16px rgba(0,0,0,0.7));
    }

    .ring-bg-track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.08);
        stroke-width: 10;
    }

    .ring-fill-bar {
        fill: none;
        stroke: #00f0ff;
        stroke-width: 10;
        stroke-linecap: round;
        transition: stroke-dashoffset 0.15s ease, stroke 0.2s ease;
    }

    .boost-center-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 92px;
        height: 92px;
        border-radius: 50%;
        background: rgba(6, 10, 18, 0.92);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 18px rgba(0,0,0,0.8);
    }

    #boost-num-big {
        font-family: 'Teko', sans-serif;
        font-size: 42px;
        font-weight: 700;
        line-height: 0.85;
        color: #fff;
        text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    }

    #speed-text {
        font-family: 'Chakra Petch', sans-serif;
        font-size: 11px;
        font-weight: 700;
        color: #94a3b8;
        letter-spacing: 0.5px;
        margin-top: 2px;
    }

    #supersonic-badge {
        position: absolute;
        bottom: -12px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Chakra Petch', sans-serif;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: #00f0ff;
        background: rgba(0, 240, 255, 0.15);
        border: 1px solid #00f0ff;
        padding: 2px 8px;
        border-radius: 10px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    #boost-meter-container.supersonic #supersonic-badge {
        opacity: 1;
        animation: supersonicRing 1.2s infinite ease-in-out;
    }

    /* ---------- BANNER DE GOL RLCS BROADCAST ---------- */
    #goal-banner-overlay {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.7);
        width: 520px;
        padding: 28px;
        text-align: center;
        border-radius: 10px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 200;
        border: 2px solid var(--active-color, var(--team-blue));
        box-shadow: 0 0 60px var(--active-glow, var(--team-blue-glow)), inset 0 0 25px rgba(0,0,0,0.85);
        clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
    }

    #goal-banner-overlay.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    #goal-title {
        font-family: 'Teko', sans-serif;
        font-size: 72px;
        font-weight: 700;
        line-height: 0.85;
        letter-spacing: 8px;
        color: var(--active-color, var(--team-blue));
        text-shadow: 0 0 25px var(--active-color, var(--team-blue));
    }

    #goal-scorer-name {
        font-family: 'Chakra Petch', sans-serif;
        font-size: 32px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #fff;
        margin-top: 4px;
        text-shadow: 0 3px 10px rgba(0,0,0,0.9);
    }

    #goal-assist-name {
        font-size: 14px;
        font-weight: 700;
        color: #cbd5e1;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 4px;
    }

    #goal-speed-val {
        font-family: 'Chakra Petch', sans-serif;
        font-size: 14px;
        font-weight: 700;
        color: #94a3b8;
        letter-spacing: 1.5px;
        margin-top: 10px;
        background: rgba(0, 0, 0, 0.5);
        display: inline-block;
        padding: 3px 16px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Punto indicador de conexión */
    #conn-dot {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #64748b;
        box-shadow: 0 0 6px rgba(0,0,0,0.5);
        z-index: 300;
    }
    #conn-dot.connected { background: #10b981; box-shadow: 0 0 8px #10b981; }
    #conn-dot.disconnected { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
</style>
</head>
<body>

    <!-- SCOREBUG CENTRAL -->
    <div id="scorebug-container">
        <div id="tournament-header">
            <span id="league-badge">THE COMMUNITY LEAGUE</span>
            <div id="series-info">
                <span id="series-phase">FINALES</span>
                <div id="pips-blue" class="pip-container"></div>
                <span>-</span>
                <div id="pips-orange" class="pip-container"></div>
                <span id="series-format">BO5</span>
            </div>
        </div>

        <div id="scorebug" class="glass-panel">
            <div class="team-block blue">
                <span id="blue-name" class="team-name">AZUL</span>
                <img id="blue-logo" class="team-logo" alt="Logo Azul">
            </div>

            <div class="score-center">
                <span id="blue-score" class="score-num">0</span>
                <span class="score-divider">:</span>
                <span id="orange-score" class="score-num">0</span>
            </div>

            <div id="timer-block">
                <span id="timer">05:00</span>
                <span id="overtime-tag">PRÓRROGA</span>
            </div>

            <div class="team-block orange">
                <img id="orange-logo" class="team-logo" alt="Logo Naranja">
                <span id="orange-name" class="team-name">NARANJA</span>
            </div>
        </div>
    </div>

    <!-- ROSTERS LATERALES -->
    <div id="roster-blue" class="roster glass-panel"></div>
    <div id="roster-orange" class="roster glass-panel"></div>

    <!-- HUD JUGADOR ESPECTADO -->
    <div id="active-player-card" class="glass-panel">
        <div id="active-player-header">
            <span id="active-player-name">-</span>
            <span id="active-player-team-tag">AZUL</span>
        </div>
        <div class="active-stats-grid">
            <div class="stat-box">
                <span class="stat-label">Puntos</span>
                <span id="ap-score" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Goles</span>
                <span id="ap-goals" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Asist</span>
                <span id="ap-assists" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Salv</span>
                <span id="ap-saves" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Tiros</span>
                <span id="ap-shots" class="stat-value">0</span>
            </div>
        </div>

        <div id="gamepad-hud">
            <span class="stat-label">Steer</span>
            <div class="gp-bar-wrap"><div id="gp-steer" class="gp-bar-fill"></div></div>
            <span class="stat-label">Gas</span>
            <div class="gp-bar-wrap"><div id="gp-throttle" class="gp-bar-fill"></div></div>
            <span id="gp-boost" class="gp-btn">BOOST</span>
            <span id="gp-jump" class="gp-btn">JUMP</span>
        </div>
    </div>

    <!-- MEDIDOR DE BOOST CIRCULAR + VELOCIMETRO -->
    <div id="boost-meter-container">
        <svg id="boost-meter-svg" viewBox="0 0 126 126">
            <circle class="ring-bg-track" cx="63" cy="63" r="52"></circle>
            <circle id="ring-fill" class="ring-fill-bar" cx="63" cy="63" r="52"></circle>
        </svg>
        <div class="boost-center-content">
            <span id="boost-num-big">0</span>
            <span id="speed-text">0 KM/H</span>
        </div>
        <span id="supersonic-badge">SUPERSONIC</span>
    </div>

    <!-- BANNER DE GOL BROADCAST -->
    <div id="goal-banner-overlay" class="glass-panel">
        <div id="goal-title">¡GOL!</div>
        <div id="goal-scorer-name">-</div>
        <div id="goal-assist-name"></div>
        <div id="goal-speed-val">0 KM/H</div>
    </div>

    <!-- PUNTO DE CONEXIÓN -->
    <div id="conn-dot"></div>

    <script type="text/javascript" src="/eel.js"></script>
    <script>
        // Elementos DOM
        const blueNameEl = document.getElementById('blue-name');
        const orangeNameEl = document.getElementById('orange-name');
        const blueLogoEl = document.getElementById('blue-logo');
        const orangeLogoEl = document.getElementById('orange-logo');
        const blueScoreEl = document.getElementById('blue-score');
        const orangeScoreEl = document.getElementById('orange-score');
        const timerEl = document.getElementById('timer');
        const overtimeTagEl = document.getElementById('overtime-tag');
        const connDotEl = document.getElementById('conn-dot');

        const seriesPhaseEl = document.getElementById('series-phase');
        const seriesFormatEl = document.getElementById('series-format');
        const pipsBlueEl = document.getElementById('pips-blue');
        const pipsOrangeEl = document.getElementById('pips-orange');

        const rosterBlueEl = document.getElementById('roster-blue');
        const rosterOrangeEl = document.getElementById('roster-orange');
        const rosterRowCache = { blue: new Map(), orange: new Map() };
        let lastRosterKey = { blue: '', orange: '' };

        const activePlayerCardEl = document.getElementById('active-player-card');
        const activePlayerNameEl = document.getElementById('active-player-name');
        const activePlayerTeamTagEl = document.getElementById('active-player-team-tag');
        const apScoreEl = document.getElementById('ap-score');
        const apGoalsEl = document.getElementById('ap-goals');
        const apAssistsEl = document.getElementById('ap-assists');
        const apSavesEl = document.getElementById('ap-saves');
        const apShotsEl = document.getElementById('ap-shots');

        const gamepadHudEl = document.getElementById('gamepad-hud');
        const gpSteerEl = document.getElementById('gp-steer');
        const gpThrottleEl = document.getElementById('gp-throttle');
        const gpBoostEl = document.getElementById('gp-boost');
        const gpJumpEl = document.getElementById('gp-jump');

        const boostMeterContainerEl = document.getElementById('boost-meter-container');
        const ringFillEl = document.getElementById('ring-fill');
        const boostNumBigEl = document.getElementById('boost-num-big');
        const speedTextEl = document.getElementById('speed-text');

        const goalBannerEl = document.getElementById('goal-banner-overlay');
        const goalScorerEl = document.getElementById('goal-scorer-name');
        const goalAssistEl = document.getElementById('goal-assist-name');
        const goalSpeedEl = document.getElementById('goal-speed-val');
        let goalBannerTimeout = null;

        // Configuración de anillo SVG Boost
        const RING_RADIUS = 52;
        const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;
        ringFillEl.style.strokeDasharray = `${RING_CIRCUMFERENCE}`;
        ringFillEl.style.strokeDashoffset = `${RING_CIRCUMFERENCE}`;

        let currentSeriesConfig = { format: 'bo5', blue_series_score: 0, orange_series_score: 0, phase: 'FINALES' };
        let currentTeamConfig = { blue_name: 'AZUL', orange_name: 'NARANJA', blue_logo: '', orange_logo: '' };
        let lastScores = { blue: 0, orange: 0 };
        let latestPlayers = [];

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function toSpeedKmh(raw) {
            if (raw > 300) return Math.round(raw * 0.036);
            if (raw > 0 && raw <= 24) return Math.round(raw * 3.6);
            return Math.round(raw);
        }

        function hexToCss(hex) {
            if (!hex) return null;
            const clean = hex.replace('#', '');
            return /^[0-9a-fA-F]{6}$/.test(clean) ? `#${clean}` : null;
        }

        function renderPips(blueWins, orangeWins, format) {
            const maxWins = format === 'bo1' ? 1 : (format === 'bo3' ? 2 : (format === 'bo7' ? 4 : 3));
            
            pipsBlueEl.innerHTML = '';
            for (let i = 0; i < maxWins; i++) {
                const pip = document.createElement('div');
                pip.className = `pip-dot ${i < blueWins ? 'active-blue' : ''}`;
                pipsBlueEl.appendChild(pip);
            }

            pipsOrangeEl.innerHTML = '';
            for (let i = 0; i < maxWins; i++) {
                const pip = document.createElement('div');
                pip.className = `pip-dot ${i < orangeWins ? 'active-orange' : ''}`;
                pipsOrangeEl.appendChild(pip);
            }
        }

        function applyTeamConfig(cfg) {
            if (!cfg) return;
            currentTeamConfig = cfg;
            const blueName = cfg.blue_name || "AZUL";
            const orangeName = cfg.orange_name || "NARANJA";
            if (blueNameEl) blueNameEl.textContent = blueName.toUpperCase();
            if (orangeNameEl) orangeNameEl.textContent = orangeName.toUpperCase();
            
            if (blueLogoEl) {
                if (cfg.blue_logo) { blueLogoEl.src = cfg.blue_logo; blueLogoEl.style.display = 'inline-block'; }
                else { blueLogoEl.style.display = 'none'; }
            }
            if (orangeLogoEl) {
                if (cfg.orange_logo) { orangeLogoEl.src = cfg.orange_logo; orangeLogoEl.style.display = 'inline-block'; }
                else { orangeLogoEl.style.display = 'none'; }
            }
        }

        function applySeriesConfig(cfg) {
            if (!cfg) return;
            currentSeriesConfig = cfg;
            if (seriesPhaseEl) seriesPhaseEl.textContent = cfg.phase ? cfg.phase.toUpperCase() : 'PARTIDO';
            const fmt = (cfg.format || 'bo5').toLowerCase();
            if (seriesFormatEl) seriesFormatEl.textContent = fmt.toUpperCase();
            
            renderPips(cfg.blue_series_score || 0, cfg.orange_series_score || 0, fmt);
        }

        eel.expose(on_team_config_update);
        function on_team_config_update(cfg) { applyTeamConfig(cfg); }

        eel.expose(on_series_config_update);
        function on_series_config_update(cfg) { applySeriesConfig(cfg); }

        eel.expose(on_status_change);
        function on_status_change(status) {
            if (!connDotEl) return;
            connDotEl.className = status === 'connected' ? 'connected' : (status === 'connecting' ? '' : 'disconnected');
        }

        function updateRoster(side, players, activePlayerName) {
            const container = side === 'blue' ? rosterBlueEl : rosterOrangeEl;
            const cache = rosterRowCache[side];
            const key = players.map(p => p.Name || p.name || '').join('|');

            if (key !== lastRosterKey[side]) {
                container.innerHTML = '';
                cache.clear();
                players.forEach(p => {
                    const name = p.Name || p.name || 'Jugador';
                    const row = document.createElement('div');
                    row.className = 'roster-row';
                    row.innerHTML = `
                        <div class="spectate-icon"></div>
                        <span class="roster-player-name"></span>
                        <div class="roster-boost-bar-wrap"><div class="roster-boost-fill"></div></div>
                        <span class="roster-boost-num">0</span>
                        <span class="roster-demo-badge">DEMO</span>
                    `;
                    row.querySelector('.roster-player-name').textContent = name;
                    container.appendChild(row);
                    cache.set(name, {
                        row,
                        fill: row.querySelector('.roster-boost-fill'),
                        num: row.querySelector('.roster-boost-num')
                    });
                });
                lastRosterKey[side] = key;
            }

            players.forEach(p => {
                const name = p.Name || p.name || 'Jugador';
                const entry = cache.get(name);
                if (!entry) return;
                
                const boost = p.Boost !== undefined ? p.Boost : (p.boost !== undefined ? p.boost : 0);
                const demoed = p.bHasCar === false;
                const isSpectated = name.toUpperCase() === (activePlayerName || '').toUpperCase();

                entry.fill.style.width = `${boost}%`;
                entry.num.textContent = `${boost}`;
                
                if (boost <= 20) {
                    entry.fill.style.backgroundColor = '#ef4444';
                } else if (boost <= 50) {
                    entry.fill.style.backgroundColor = '#facc15';
                } else {
                    entry.fill.style.backgroundColor = '#00f0ff';
                }

                entry.row.classList.toggle('demoed', demoed);
                entry.row.classList.toggle('active-spectate', isSpectated);
            });
        }

        eel.expose(on_telemetry_data);
        function on_telemetry_data(payload) {
            const eventName = payload.Event || payload.event;

            if (eventName === 'GoalScored') {
                let data = payload.Data || payload.data;
                if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { return; } }
                if (!data) return;

                const scorer = data.Scorer || data.scorer || data.GoalScorer || data.player || {};
                const scorerPlayerObj = scorer.Player || scorer.player || scorer;

                const ballLastTouch = data.BallLastTouch || data.ball_last_touch || data.last_touch || {};
                const lastTouchPlayerObj = ballLastTouch.Player || ballLastTouch.player || ballLastTouch || {};

                let scorerName = scorerPlayerObj.Name || scorerPlayerObj.name || (typeof scorerPlayerObj.id === 'string' ? scorerPlayerObj.id : '');

                if (!scorerName && (scorer.id || scorer.Id || scorer.Shortcut !== undefined || scorer.pri)) {
                    const matched = latestPlayers.find(p => 
                        (scorer.id && (p.id === scorer.id || p.Id === scorer.id)) ||
                        (scorer.Shortcut !== undefined && (p.Shortcut === scorer.Shortcut || p.shortcut === scorer.Shortcut)) ||
                        (scorer.pri && (p.pri === scorer.pri || p.PRI === scorer.pri))
                    );
                    if (matched) {
                        scorerName = matched.Name || matched.name || '';
                    }
                }

                let lastTouchName = lastTouchPlayerObj.Name || lastTouchPlayerObj.name || '';
                let lastTouchTeam = lastTouchPlayerObj.TeamNum !== undefined ? lastTouchPlayerObj.TeamNum : lastTouchPlayerObj.team;

                let scoringTeamNum = scorer.TeamNum !== undefined ? scorer.TeamNum : (scorerPlayerObj.TeamNum !== undefined ? scorerPlayerObj.TeamNum : undefined);
                if (scoringTeamNum === undefined) {
                    if (lastTouchTeam !== undefined) scoringTeamNum = lastTouchTeam;
                    else scoringTeamNum = 0;
                }

                const scoringTeam = scoringTeamNum === 1 ? 'orange' : 'blue';

                let isOwnGoal = false;

                if (!scorerName) {
                    if (lastTouchName) {
                        scorerName = lastTouchName;
                        if (lastTouchTeam !== undefined && lastTouchTeam !== scoringTeamNum) {
                            isOwnGoal = true;
                        }
                    } else {
                        const teamNameVal = scoringTeamNum === 1 
                            ? (currentTeamConfig.orange_name || 'NARANJA') 
                            : (currentTeamConfig.blue_name || 'AZUL');
                        scorerName = `GOL ${teamNameVal}`;
                    }
                } else {
                    const scorerTeamNum = scorerPlayerObj.TeamNum !== undefined ? scorerPlayerObj.TeamNum : scorer.TeamNum;
                    if (scorerTeamNum !== undefined && scorerTeamNum !== scoringTeamNum) {
                        isOwnGoal = true;
                    }
                }

                document.documentElement.style.setProperty('--active-color', `var(--team-${scoringTeam})`);
                document.documentElement.style.setProperty('--active-glow', `var(--team-${scoringTeam}-glow)`);

                if (isOwnGoal) {
                    goalScorerEl.textContent = `${scorerName.toUpperCase()} (AUTOGOL)`;
                    goalAssistEl.style.display = 'none';
                } else {
                    goalScorerEl.textContent = scorerName.toUpperCase();
                    
                    if (lastTouchName && lastTouchName.toUpperCase() !== scorerName.toUpperCase() && (lastTouchTeam === undefined || lastTouchTeam === scoringTeamNum)) {
                        goalAssistEl.textContent = `ASISTENCIA: ${lastTouchName.toUpperCase()}`;
                        goalAssistEl.style.display = 'block';
                    } else {
                        goalAssistEl.style.display = 'none';
                    }
                }

                const speedKmh = toSpeedKmh(data.GoalSpeed || data.goal_speed || 0);
                goalSpeedEl.textContent = `DISPARO A ${speedKmh} KM/H`;

                if (goalBannerTimeout) clearTimeout(goalBannerTimeout);
                goalBannerEl.classList.add('show');
                goalBannerTimeout = setTimeout(() => goalBannerEl.classList.remove('show'), 4200);
                return;
            }

            if (eventName && eventName !== 'UpdateState') return;

            let data = payload.Data || payload.data;
            if (!data) return;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (e) { return; }
            }

            const game = data.Game || data.game;
            if (game) {
                let blueScoreVal = 0;
                let orangeScoreVal = 0;
                if (game.Teams || game.teams) {
                    (game.Teams || game.teams).forEach(t => {
                        const teamNum = t.TeamNum !== undefined ? t.TeamNum : t.team;
                        const score = t.Score !== undefined ? t.Score : t.score;
                        const name = t.Name || t.name;
                        const color = hexToCss(t.ColorPrimary);
                        if (teamNum === 0) {
                            blueScoreVal = score;
                            if (color) document.documentElement.style.setProperty('--team-blue', color);
                            if (name && name.trim() !== "" && (!currentTeamConfig.blue_name || currentTeamConfig.blue_name.toUpperCase() === 'AZUL')) {
                                if (blueNameEl) blueNameEl.textContent = name.toUpperCase();
                            }
                        }
                        if (teamNum === 1) {
                            orangeScoreVal = score;
                            if (color) document.documentElement.style.setProperty('--team-orange', color);
                            if (name && name.trim() !== "" && (!currentTeamConfig.orange_name || currentTeamConfig.orange_name.toUpperCase() === 'NARANJA')) {
                                if (orangeNameEl) orangeNameEl.textContent = name.toUpperCase();
                            }
                        }
                    });
                } else {
                    blueScoreVal = game.blue_score !== undefined ? game.blue_score : 0;
                    orangeScoreVal = game.orange_score !== undefined ? game.orange_score : 0;
                }

                if (blueScoreVal !== lastScores.blue) {
                    blueScoreEl.textContent = blueScoreVal;
                    blueScoreEl.classList.remove('flash');
                    void blueScoreEl.offsetWidth;
                    blueScoreEl.classList.add('flash');
                    lastScores.blue = blueScoreVal;
                }
                if (orangeScoreVal !== lastScores.orange) {
                    orangeScoreEl.textContent = orangeScoreVal;
                    orangeScoreEl.classList.remove('flash');
                    void orangeScoreEl.offsetWidth;
                    orangeScoreEl.classList.add('flash');
                    lastScores.orange = orangeScoreVal;
                }

                const time = game.TimeSeconds !== undefined ? game.TimeSeconds : (game.time !== undefined ? game.time : 300);
                if (timerEl) timerEl.textContent = formatTime(time);
                if (overtimeTagEl) overtimeTagEl.style.display = game.bOvertime ? 'inline-block' : 'none';
            }

            const players = data.Players || data.players;
            if (players && players.length > 0) {
                latestPlayers = players;
                const bluePlayers = players.filter(p => (p.TeamNum !== undefined ? p.TeamNum : p.team) === 0);
                const orangePlayers = players.filter(p => (p.TeamNum !== undefined ? p.TeamNum : p.team) === 1);

                const target = game && (game.Target || game.target);
                let activePlayer = null;
                if (target && target.Name) {
                    activePlayer = players.find(p => (p.Name || p.name) === target.Name);
                }
                if (!activePlayer) activePlayer = players[0];

                const activeName = activePlayer ? (activePlayer.Name || activePlayer.name || '') : '';
                updateRoster('blue', bluePlayers, activeName);
                updateRoster('orange', orangePlayers, activeName);

                if (activePlayer) {
                    const teamNum = activePlayer.TeamNum !== undefined ? activePlayer.TeamNum : activePlayer.team;
                    const boost = activePlayer.Boost !== undefined ? activePlayer.Boost : 0;
                    const speedVal = activePlayer.Speed !== undefined ? activePlayer.Speed : (activePlayer.speed !== undefined ? activePlayer.speed : 0);
                    const speedKmh = toSpeedKmh(speedVal);

                    const teamColorVar = teamNum === 1 ? 'var(--team-orange)' : 'var(--team-blue)';
                    
                    activePlayerCardEl.style.setProperty('--active-color', teamColorVar);
                    activePlayerNameEl.textContent = (activePlayer.Name || activePlayer.name || '-').toUpperCase();
                    activePlayerTeamTagEl.textContent = teamNum === 1 ? 'NARANJA' : 'AZUL';
                    activePlayerTeamTagEl.style.backgroundColor = teamColorVar;

                    apScoreEl.textContent = activePlayer.Score !== undefined ? activePlayer.Score : 0;
                    apGoalsEl.textContent = activePlayer.Goals !== undefined ? activePlayer.Goals : 0;
                    apAssistsEl.textContent = activePlayer.Assists !== undefined ? activePlayer.Assists : 0;
                    apSavesEl.textContent = activePlayer.Saves !== undefined ? activePlayer.Saves : 0;
                    apShotsEl.textContent = activePlayer.Shots !== undefined ? activePlayer.Shots : 0;
                    activePlayerCardEl.classList.add('visible');

                    const gp = data.GamepadInput || activePlayer.GamepadInput;
                    if (gp) {
                        gamepadHudEl.classList.add('active');
                        if (gpSteerEl) gpSteerEl.style.width = `${Math.min(100, Math.max(0, (gp.Steer || 0) + 50))}%`;
                        if (gpThrottleEl) gpThrottleEl.style.width = `${Math.min(100, Math.max(0, (gp.Throttle || 0) + 50))}%`;
                        if (gpBoostEl) gpBoostEl.classList.toggle('pressed', !!gp.BoostButton);
                        if (gpJumpEl) gpJumpEl.classList.toggle('pressed', !!gp.JumpButton);
                    } else {
                        gamepadHudEl.classList.remove('active');
                    }

                    boostNumBigEl.textContent = `${boost}`;
                    speedTextEl.textContent = `${speedKmh} KM/H`;

                    const offset = RING_CIRCUMFERENCE * (1 - boost / 100);
                    ringFillEl.style.strokeDashoffset = `${offset}`;
                    
                    if (boost <= 20) {
                        ringFillEl.style.stroke = '#ef4444';
                    } else if (boost >= 100) {
                        ringFillEl.style.stroke = '#facc15';
                    } else {
                        ringFillEl.style.stroke = '#00f0ff';
                    }

                    if (speedKmh >= 80) {
                        boostMeterContainerEl.classList.add('supersonic');
                    } else {
                        boostMeterContainerEl.classList.remove('supersonic');
                    }

                    boostMeterContainerEl.classList.add('visible');
                }
            }
        }

        (async () => {
            try {
                const cfg = await eel.get_team_config()();
                applyTeamConfig(cfg);
            } catch (err) {
                console.error("Error al cargar configuración de equipos:", err);
            }
            try {
                const seriesCfg = await eel.get_series_config()();
                applySeriesConfig(seriesCfg);
            } catch (err) {
                console.error("Error al cargar configuración de la serie:", err);
            }
        })();

        setInterval(() => {
            const ws = eel._websocket;
            if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
                location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
