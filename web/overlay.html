<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Overlay OBS - The Community League</title>
    <link rel="icon" type="image/png" href="/logo_peri.png">
    <link rel="stylesheet" href="/tailwind.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Rajdhani:wght@600;700&family=Teko:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --team-blue: #0088ff;
            --team-blue-dark: #0044bb;
            --team-blue-glow: rgba(0, 136, 255, 0.7);
            --team-orange: #ff6600;
            --team-orange-dark: #cc3300;
            --team-orange-glow: rgba(255, 102, 0, 0.7);
            --panel-bg: rgba(6, 10, 18, 0.88);
            --panel-border: rgba(255, 255, 255, 0.14);
            --active-color: var(--team-blue);
            --active-glow: var(--team-blue-glow);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            color: #fff;
            user-select: none;
        }

        * {
            box-sizing: border-box;
        }

        /* Glassmorphism Esports Base */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75);
        }

        /* Keyframes de animación */
        @keyframes pulseGlow {

            0%,
            100% {
                opacity: 0.8;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.04);
            }
        }

        @keyframes scoreFlash {
            0% {
                transform: scale(1);
                filter: brightness(1);
            }

            40% {
                transform: scale(1.3);
                filter: brightness(2) drop-shadow(0 0 20px #fff);
            }

            100% {
                transform: scale(1);
                filter: brightness(1);
            }
        }

        @keyframes demoStrobe {

            0%,
            100% {
                opacity: 1;
                background: rgba(239, 68, 68, 0.9);
            }

            50% {
                opacity: 0.4;
                background: rgba(239, 68, 68, 0.3);
            }
        }

        @keyframes supersonicRing {
            0% {
                box-shadow: 0 0 12px #00f0ff, inset 0 0 8px #00f0ff;
                transform: scale(1);
            }

            50% {
                box-shadow: 0 0 30px #00f0ff, inset 0 0 18px #00f0ff;
                transform: scale(1.05);
            }

            100% {
                box-shadow: 0 0 12px #00f0ff, inset 0 0 8px #00f0ff;
                transform: scale(1);
            }
        }

        /* ---------- SCOREBUG CENTRAL ESTILO RLCS ---------- */
        #scorebug-container {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
        }

        /* Tournament & Series Header Bar */
        #tournament-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 6px;
            background: rgba(4, 7, 14, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 8px 30px;
            border-radius: 10px 10px 0 0;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-bottom: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
        }

        #league-badge {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #league-logo {
            height: 28px;
            width: 28px;
            object-fit: contain;
            filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.8));
        }

        #league-badge::before,
        #league-badge::after {
            content: '';
            width: 20px;
            height: 2px;
            background: var(--active-color, #0088ff);
            box-shadow: 0 0 8px var(--active-color, #0088ff);
        }

        #series-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #cbd5e1;
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            padding-left: 16px;
        }

        .pip-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pip-dot {
            width: 16px;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            transform: skewX(-20deg);
            transition: all 0.3s ease;
        }

        .pip-dot.active-blue {
            background: var(--team-blue);
            border-color: #38bdf8;
            box-shadow: 0 0 12px var(--team-blue-glow);
        }

        .pip-dot.active-orange {
            background: var(--team-orange);
            border-color: #fb923c;
            box-shadow: 0 0 12px var(--team-orange-glow);
        }

        /* Scorebug Main Bar */
        #scorebug {
            display: flex;
            align-items: stretch;
            height: 72px;
            min-width: 920px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
        }

        .team-block {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 36px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .team-block.blue {
            justify-content: flex-end;
            text-align: right;
            background: linear-gradient(90deg, rgba(0, 136, 255, 0.75) 0%, rgba(0, 68, 187, 0.25) 100%);
            border-right: 3px solid rgba(0, 136, 255, 0.6);
        }

        .team-block.orange {
            justify-content: flex-start;
            text-align: left;
            background: linear-gradient(270deg, rgba(255, 102, 0, 0.75) 0%, rgba(204, 51, 0, 0.25) 100%);
            border-left: 3px solid rgba(255, 102, 0, 0.6);
        }

        .team-name {
            white-space: nowrap;
            overflow: hidden;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
            display: inline-block;
            transition: font-size 0.1s ease;
        }

        .team-logo-box {
            width: 48px;
            height: 48px;
            min-width: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            padding: 4px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.6);
        }

        .team-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.8));
            display: none;
        }

        /* Center Score & Timer Section */
        .score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(3, 6, 12, 0.96);
            padding: 0 22px;
            min-width: 280px;
            gap: 16px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
        }

        .score-num {
            font-family: 'Teko', sans-serif;
            font-size: 58px;
            font-weight: 700;
            line-height: 0.9;
            min-width: 44px;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
        }

        .score-num.flash {
            animation: scoreFlash 0.6s ease-out;
        }

        #timer-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 110px;
            background: rgba(15, 23, 42, 0.92);
            padding: 2px 18px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        #timer {
            font-family: 'Teko', sans-serif;
            font-size: 44px;
            font-weight: 700;
            line-height: 0.95;
            color: #f8fafc;
            letter-spacing: 1.5px;
        }

        #overtime-tag {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #ef4444;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: none;
            margin-top: 1px;
            animation: pulseGlow 1.2s infinite ease-in-out;
        }

        /* ---------- ROSTERS LATERALES PRO RLCS ---------- */
        .roster {
            position: absolute;
            top: 200px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 310px;
            padding: 12px;
            border-radius: 8px;
            z-index: 90;
        }

        #roster-blue {
            left: 24px;
            border-left: 5px solid var(--team-blue);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
        }

        #roster-orange {
            right: 24px;
            border-right: 5px solid var(--team-orange);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 14px 100%, 0 calc(100% - 14px));
        }

        .roster-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            transition: all 0.25s ease;
            position: relative;
        }

        .roster-row.active-spectate {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.2);
        }

        #roster-blue .roster-row.active-spectate {
            border-left: 5px solid #38bdf8;
        }

        #roster-orange .roster-row.active-spectate {
            border-right: 5px solid #fb923c;
        }

        .spectate-icon {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .roster-row.active-spectate .spectate-icon {
            opacity: 1;
        }

        .roster-player-name {
            flex: 1;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            letter-spacing: 0.5px;
            display: inline-block;
            transition: font-size 0.1s ease;
        }

        .roster-boost-bar-wrap {
            width: 80px;
            height: 16px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.16);
        }

        .roster-boost-fill {
            height: 100%;
            width: 0%;
            background: #00f0ff;
            transition: width 0.2s ease, background-color 0.2s ease;
        }

        .roster-boost-num {
            font-family: 'Teko', sans-serif;
            font-size: 28px;
            font-weight: 700;
            width: 42px;
            text-align: right;
            color: #f1f5f9;
            line-height: 1;
        }

        .roster-demo-badge {
            display: none;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            padding: 2px 7px;
            border-radius: 3px;
            letter-spacing: 1px;
            animation: demoStrobe 0.8s infinite;
        }

        .roster-row.demoed {
            opacity: 0.45;
        }

        .roster-row.demoed .roster-demo-badge {
            display: block;
        }

        .roster-row.demoed .roster-boost-bar-wrap,
        .roster-row.demoed .roster-boost-num {
            display: none;
        }

        /* ---------- HUD JUGADOR ESPECTADO (BOTTOM LEFT) ---------- */
        #active-player-card {
            position: absolute;
            bottom: 32px;
            left: 32px;
            min-width: 440px;
            padding: 18px 24px;
            border-radius: 12px;
            border-left: 6px solid var(--active-color, var(--team-blue));
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            z-index: 90;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
        }

        #active-player-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #active-player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 8px;
        }

        #active-player-name {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
        }

        #active-player-team-tag {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 4px 16px;
            border-radius: 4px;
            background: var(--active-color, var(--team-blue));
            color: #fff;
            text-transform: uppercase;
            white-space: nowrap;
            display: inline-block;
            transition: font-size 0.1s ease;
        }

        .active-stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            text-align: center;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.4);
            padding: 7px 4px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .stat-label {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-family: 'Teko', sans-serif;
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
            color: #fff;
        }

        /* Telemetría de Mando */
        #gamepad-hud {
            display: none;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.12);
        }

        #gamepad-hud.active {
            display: flex;
        }

        .gp-bar-wrap {
            flex: 1;
            height: 8px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 4px;
            overflow: hidden;
        }

        .gp-bar-fill {
            height: 100%;
            width: 50%;
            background: #38bdf8;
            transition: width 0.08s linear;
        }

        .gp-btn {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.12);
            color: #64748b;
        }

        .gp-btn.pressed {
            background: #22c55e;
            color: #fff;
            box-shadow: 0 0 8px #22c55e;
        }

        /* ---------- MEDIDOR DE BOOST CIRCULAR + VELOCIMETRO ---------- */
        #boost-meter-container {
            position: absolute;
            bottom: 32px;
            right: 32px;
            width: 170px;
            height: 170px;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.35s ease, transform 0.35s ease;
            z-index: 90;
            background: radial-gradient(circle, rgba(6, 10, 18, 0.6) 0%, rgba(6, 10, 18, 0.35) 60%, rgba(6, 10, 18, 0) 100%);
            border-radius: 50%;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #boost-meter-container.visible {
            opacity: 1;
            transform: scale(1);
        }

        #boost-meter-container.supersonic #ring-fill {
            filter: drop-shadow(0 0 14px #00f0ff);
        }

        #boost-meter-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.85));
        }

        .ring-bg-track {
            fill: none;
            stroke: rgba(0, 0, 0, 0.45);
            stroke-width: 12;
        }

        .ring-fill-bar {
            fill: none;
            stroke: #00f0ff;
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.15s ease, stroke 0.2s ease;
            filter: drop-shadow(0 0 8px currentcolor);
        }

        .boost-center-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #boost-num-big {
            font-family: 'Teko', sans-serif;
            font-size: 76px;
            font-weight: 700;
            line-height: 0.8;
            color: #fff;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.9), 0 0 16px rgba(0, 240, 255, 0.6);
        }

        #speed-text {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
            letter-spacing: 1.2px;
            margin-top: -2px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        /* Punto indicador de conexión */
        #conn-dot {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
            z-index: 300;
        }

        #conn-dot.connected {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        #conn-dot.disconnected {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }
    </style>
</head>

<body class="bg-transparent text-white font-sans overflow-hidden select-none">

    <!-- SCOREBUG CENTRAL -->
    <div id="scorebug-container">
        <div id="tournament-header">
            <span id="league-badge">
                <img id="league-logo" src="/The_Comunity_League.webp" alt="The Community League">
                THE COMMUNITY LEAGUE
            </span>
            <div id="series-info">
                <span id="series-phase">FINALES</span>
                <div id="pips-blue" class="pip-container"></div>
                <span>-</span>
                <div id="pips-orange" class="pip-container"></div>
                <span id="series-format">BO5</span>
            </div>
        </div>

        <div id="scorebug">
            <div class="team-block blue">
                <div class="team-logo-box">
                    <img id="blue-logo" class="team-logo" alt="Logo Azul">
                </div>
                <span id="blue-name" class="team-name">AZUL</span>
            </div>

            <div class="score-center">
                <span id="blue-score" class="score-num">0</span>
                <div id="timer-block">
                    <span id="timer">05:00</span>
                    <span id="overtime-tag">PRÓRROGA</span>
                </div>
                <span id="orange-score" class="score-num">0</span>
            </div>

            <div class="team-block orange">
                <span id="orange-name" class="team-name">NARANJA</span>
                <div class="team-logo-box">
                    <img id="orange-logo" class="team-logo" alt="Logo Naranja">
                </div>
            </div>
        </div>
    </div>

    <!-- ROSTERS LATERALES -->
    <div id="roster-blue" class="roster glass-panel"></div>
    <div id="roster-orange" class="roster glass-panel"></div>

    <!-- HUD JUGADOR ESPECTADO -->
    <div id="active-player-card" class="glass-panel">
        <div id="active-player-header">
            <span id="active-player-name">-</span>
            <span id="active-player-team-tag">AZUL</span>
        </div>
        <div class="active-stats-grid">
            <div class="stat-box">
                <span class="stat-label">Puntos</span>
                <span id="ap-score" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Goles</span>
                <span id="ap-goals" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Asist</span>
                <span id="ap-assists" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Salv</span>
                <span id="ap-saves" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Tiros</span>
                <span id="ap-shots" class="stat-value">0</span>
            </div>
        </div>

        <div id="gamepad-hud">
            <span class="stat-label">Steer</span>
            <div class="gp-bar-wrap">
                <div id="gp-steer" class="gp-bar-fill"></div>
            </div>
            <span class="stat-label">Gas</span>
            <div class="gp-bar-wrap">
                <div id="gp-throttle" class="gp-bar-fill"></div>
            </div>
            <span id="gp-boost" class="gp-btn">BOOST</span>
            <span id="gp-jump" class="gp-btn">JUMP</span>
        </div>
    </div>

    <!-- MEDIDOR DE BOOST CIRCULAR + VELOCIMETRO -->
    <div id="boost-meter-container">
        <svg id="boost-meter-svg" viewBox="0 0 170 170">
            <circle class="ring-bg-track" cx="85" cy="85" r="70"></circle>
            <circle id="ring-fill" class="ring-fill-bar" cx="85" cy="85" r="70"></circle>
        </svg>
        <div class="boost-center-content">
            <span id="boost-num-big">0</span>
            <span id="speed-text">0 KM/H</span>
        </div>
    </div>

    <!-- PUNTO DE CONEXIÓN -->
    <div id="conn-dot"></div>

    <script type="text/javascript" src="/eel.js"></script>
    <script>
        // Elementos DOM
        const blueNameEl = document.getElementById('blue-name');
        const orangeNameEl = document.getElementById('orange-name');
        const blueLogoEl = document.getElementById('blue-logo');
        const orangeLogoEl = document.getElementById('orange-logo');
        const blueScoreEl = document.getElementById('blue-score');
        const orangeScoreEl = document.getElementById('orange-score');
        const timerEl = document.getElementById('timer');
        const overtimeTagEl = document.getElementById('overtime-tag');
        const connDotEl = document.getElementById('conn-dot');

        const seriesPhaseEl = document.getElementById('series-phase');
        const seriesFormatEl = document.getElementById('series-format');
        const pipsBlueEl = document.getElementById('pips-blue');
        const pipsOrangeEl = document.getElementById('pips-orange');

        const rosterBlueEl = document.getElementById('roster-blue');
        const rosterOrangeEl = document.getElementById('roster-orange');
        const rosterRowCache = { blue: new Map(), orange: new Map() };
        let lastRosterKey = { blue: '', orange: '' };

        const activePlayerCardEl = document.getElementById('active-player-card');
        const activePlayerNameEl = document.getElementById('active-player-name');
        const activePlayerTeamTagEl = document.getElementById('active-player-team-tag');
        const apScoreEl = document.getElementById('ap-score');
        const apGoalsEl = document.getElementById('ap-goals');
        const apAssistsEl = document.getElementById('ap-assists');
        const apSavesEl = document.getElementById('ap-saves');
        const apShotsEl = document.getElementById('ap-shots');

        const gamepadHudEl = document.getElementById('gamepad-hud');
        const gpSteerEl = document.getElementById('gp-steer');
        const gpThrottleEl = document.getElementById('gp-throttle');
        const gpBoostEl = document.getElementById('gp-boost');
        const gpJumpEl = document.getElementById('gp-jump');

        const boostMeterContainerEl = document.getElementById('boost-meter-container');
        const ringFillEl = document.getElementById('ring-fill');
        const boostNumBigEl = document.getElementById('boost-num-big');
        const speedTextEl = document.getElementById('speed-text');

        // Configuración de anillo SVG Boost
        const RING_RADIUS = 70;
        const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;
        ringFillEl.style.strokeDasharray = `${RING_CIRCUMFERENCE}`;
        ringFillEl.style.strokeDashoffset = `${RING_CIRCUMFERENCE}`;

        let currentSeriesConfig = { format: 'bo5', blue_series_score: 0, orange_series_score: 0, phase: 'FINALES' };
        let currentTeamConfig = { blue_name: 'AZUL', orange_name: 'NARANJA', blue_logo: '', orange_logo: '' };
        let lastScores = { blue: 0, orange: 0 };
        let latestPlayers = [];

        function fitText(el, maxFontSize = 36, minFontSize = 12) {
            if (!el) return;
            el.style.fontSize = `${maxFontSize}px`;
            const parent = el.parentElement;
            if (!parent) return;
            const availableWidth = parent.clientWidth - 20;
            let currentSize = maxFontSize;
            while (el.scrollWidth > availableWidth && currentSize > minFontSize) {
                currentSize -= 1;
                el.style.fontSize = `${currentSize}px`;
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function toSpeedKmh(raw) {
            if (raw > 300) return Math.round(raw * 0.036);
            if (raw > 0 && raw <= 24) return Math.round(raw * 3.6);
            return Math.round(raw);
        }

        function hexToCss(hex) {
            if (!hex) return null;
            const clean = hex.replace('#', '');
            return /^[0-9a-fA-F]{6}$/.test(clean) ? `#${clean}` : null;
        }

        function renderPips(blueWins, orangeWins, format) {
            const maxWins = format === 'bo1' ? 1 : (format === 'bo3' ? 2 : (format === 'bo7' ? 4 : 3));

            pipsBlueEl.innerHTML = '';
            for (let i = 0; i < maxWins; i++) {
                const pip = document.createElement('div');
                pip.className = `pip-dot ${i < blueWins ? 'active-blue' : ''}`;
                pipsBlueEl.appendChild(pip);
            }

            pipsOrangeEl.innerHTML = '';
            for (let i = 0; i < maxWins; i++) {
                const pip = document.createElement('div');
                pip.className = `pip-dot ${i < orangeWins ? 'active-orange' : ''}`;
                pipsOrangeEl.appendChild(pip);
            }
        }

        function applyTeamConfig(cfg) {
            if (!cfg) return;
            currentTeamConfig = cfg;
            const blueName = cfg.blue_name || "AZUL";
            const orangeName = cfg.orange_name || "NARANJA";
            if (blueNameEl) {
                blueNameEl.textContent = blueName.toUpperCase();
                fitText(blueNameEl, 36, 16);
            }
            if (orangeNameEl) {
                orangeNameEl.textContent = orangeName.toUpperCase();
                fitText(orangeNameEl, 36, 16);
            }

            if (blueLogoEl) {
                if (cfg.blue_logo) { blueLogoEl.src = cfg.blue_logo; blueLogoEl.style.display = 'inline-block'; }
                else { blueLogoEl.style.display = 'none'; }
            }
            if (orangeLogoEl) {
                if (cfg.orange_logo) { orangeLogoEl.src = cfg.orange_logo; orangeLogoEl.style.display = 'inline-block'; }
                else { orangeLogoEl.style.display = 'none'; }
            }
        }

        function applySeriesConfig(cfg) {
            if (!cfg) return;
            currentSeriesConfig = cfg;
            if (seriesPhaseEl) seriesPhaseEl.textContent = cfg.phase ? cfg.phase.toUpperCase() : 'PARTIDO';
            const fmt = (cfg.format || 'bo5').toLowerCase();
            if (seriesFormatEl) seriesFormatEl.textContent = fmt.toUpperCase();

            renderPips(cfg.blue_series_score || 0, cfg.orange_series_score || 0, fmt);
        }

        eel.expose(on_team_config_update);
        function on_team_config_update(cfg) { applyTeamConfig(cfg); }

        eel.expose(on_series_config_update);
        function on_series_config_update(cfg) { applySeriesConfig(cfg); }

        eel.expose(on_status_change);
        function on_status_change(status) {
            if (!connDotEl) return;
            connDotEl.className = status === 'connected' ? 'connected' : (status === 'connecting' ? '' : 'disconnected');
        }

        function updateRoster(side, players, activePlayerName) {
            const container = side === 'blue' ? rosterBlueEl : rosterOrangeEl;
            const cache = rosterRowCache[side];
            const key = players.map(p => p.Name || p.name || '').join('|');

            if (key !== lastRosterKey[side]) {
                container.innerHTML = '';
                cache.clear();
                players.forEach(p => {
                    const name = p.Name || p.name || 'Jugador';
                    const row = document.createElement('div');
                    row.className = 'roster-row';
                    row.innerHTML = `
                        <div class="spectate-icon"></div>
                        <span class="roster-player-name"></span>
                        <div class="roster-boost-bar-wrap"><div class="roster-boost-fill"></div></div>
                        <span class="roster-boost-num">0</span>
                        <span class="roster-demo-badge">DEMO</span>
                    `;
                    const nameEl = row.querySelector('.roster-player-name');
                    nameEl.textContent = name;
                    fitText(nameEl, 16, 11);
                    container.appendChild(row);
                    cache.set(name, {
                        row,
                        fill: row.querySelector('.roster-boost-fill'),
                        num: row.querySelector('.roster-boost-num')
                    });
                });
                lastRosterKey[side] = key;
            }

            players.forEach(p => {
                const name = p.Name || p.name || 'Jugador';
                const entry = cache.get(name);
                if (!entry) return;

                const boost = p.Boost !== undefined ? p.Boost : (p.boost !== undefined ? p.boost : 0);
                const demoed = p.bHasCar === false;
                const isSpectated = name.toUpperCase() === (activePlayerName || '').toUpperCase();

                entry.fill.style.width = `${boost}%`;
                entry.num.textContent = `${boost}`;

                if (boost <= 20) {
                    entry.fill.style.backgroundColor = '#ef4444';
                } else if (boost <= 50) {
                    entry.fill.style.backgroundColor = '#facc15';
                } else {
                    entry.fill.style.backgroundColor = '#00f0ff';
                }

                entry.row.classList.toggle('demoed', demoed);
                entry.row.classList.toggle('active-spectate', isSpectated);
            });
        }

        eel.expose(on_telemetry_data);
        function on_telemetry_data(payload) {
            const eventName = payload.Event || payload.event;

            if (eventName === 'GoalScored') {
                let data = payload.Data || payload.data;
                if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { return; } }
                if (!data) return;

                const scorer = data.Scorer || data.scorer || data.GoalScorer || data.player || {};
                const scorerPlayerObj = scorer.Player || scorer.player || scorer;
                const ballLastTouch = data.BallLastTouch || data.ball_last_touch || data.last_touch || {};
                const lastTouchPlayerObj = ballLastTouch.Player || ballLastTouch.player || ballLastTouch || {};
                const lastTouchTeam = lastTouchPlayerObj.TeamNum !== undefined ? lastTouchPlayerObj.TeamNum : lastTouchPlayerObj.team;

                let scoringTeamNum = scorer.TeamNum !== undefined ? scorer.TeamNum : (scorerPlayerObj.TeamNum !== undefined ? scorerPlayerObj.TeamNum : undefined);
                if (scoringTeamNum === undefined) {
                    scoringTeamNum = lastTouchTeam !== undefined ? lastTouchTeam : 0;
                }
                const scoringTeam = scoringTeamNum === 1 ? 'orange' : 'blue';

                document.documentElement.style.setProperty('--active-color', `var(--team-${scoringTeam})`);
                document.documentElement.style.setProperty('--active-glow', `var(--team-${scoringTeam}-glow)`);
                return;
            }

            if (eventName && eventName !== 'UpdateState') return;

            let data = payload.Data || payload.data;
            if (!data) return;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (e) { return; }
            }

            const game = data.Game || data.game;
            if (game) {
                let blueScoreVal = 0;
                let orangeScoreVal = 0;
                if (game.Teams || game.teams) {
                    (game.Teams || game.teams).forEach(t => {
                        const teamNum = t.TeamNum !== undefined ? t.TeamNum : t.team;
                        const score = t.Score !== undefined ? t.Score : t.score;
                        const name = t.Name || t.name;
                        const color = hexToCss(t.ColorPrimary);
                        if (teamNum === 0) {
                            blueScoreVal = score;
                            if (color) document.documentElement.style.setProperty('--team-blue', color);
                            let displayName = (name || '').trim().toUpperCase();
                            if (!displayName || displayName === 'BLUE') displayName = 'AZUL';
                            if (blueNameEl) {
                                blueNameEl.textContent = displayName;
                                fitText(blueNameEl, 36, 16);
                            }
                        }
                        if (teamNum === 1) {
                            orangeScoreVal = score;
                            if (color) document.documentElement.style.setProperty('--team-orange', color);
                            let displayName = (name || '').trim().toUpperCase();
                            if (!displayName || displayName === 'ORANGE') displayName = 'NARANJA';
                            if (orangeNameEl) {
                                orangeNameEl.textContent = displayName;
                                fitText(orangeNameEl, 36, 16);
                            }
                        }
                    });
                } else {
                    blueScoreVal = game.blue_score !== undefined ? game.blue_score : 0;
                    orangeScoreVal = game.orange_score !== undefined ? game.orange_score : 0;
                }

                if (blueScoreVal !== lastScores.blue) {
                    blueScoreEl.textContent = blueScoreVal;
                    blueScoreEl.classList.remove('flash');
                    void blueScoreEl.offsetWidth;
                    blueScoreEl.classList.add('flash');
                    lastScores.blue = blueScoreVal;
                }
                if (orangeScoreVal !== lastScores.orange) {
                    orangeScoreEl.textContent = orangeScoreVal;
                    orangeScoreEl.classList.remove('flash');
                    void orangeScoreEl.offsetWidth;
                    orangeScoreEl.classList.add('flash');
                    lastScores.orange = orangeScoreVal;
                }

                const time = game.TimeSeconds !== undefined ? game.TimeSeconds : (game.time !== undefined ? game.time : 300);
                if (timerEl) timerEl.textContent = formatTime(time);
                if (overtimeTagEl) overtimeTagEl.style.display = game.bOvertime ? 'inline-block' : 'none';
            }

            const players = data.Players || data.players;
            if (players && players.length > 0) {
                latestPlayers = players;
                const bluePlayers = players.filter(p => (p.TeamNum !== undefined ? p.TeamNum : p.team) === 0);
                const orangePlayers = players.filter(p => (p.TeamNum !== undefined ? p.TeamNum : p.team) === 1);

                const target = game && (game.Target || game.target);
                let activePlayer = null;
                if (target && target.Name) {
                    activePlayer = players.find(p => (p.Name || p.name) === target.Name);
                }
                if (!activePlayer) activePlayer = players[0];

                const activeName = activePlayer ? (activePlayer.Name || activePlayer.name || '') : '';
                updateRoster('blue', bluePlayers, activeName);
                updateRoster('orange', orangePlayers, activeName);

                if (activePlayer) {
                    const teamNum = activePlayer.TeamNum !== undefined ? activePlayer.TeamNum : activePlayer.team;
                    const boost = activePlayer.Boost !== undefined ? activePlayer.Boost : 0;
                    const speedVal = activePlayer.Speed !== undefined ? activePlayer.Speed : (activePlayer.speed !== undefined ? activePlayer.speed : 0);
                    const speedKmh = toSpeedKmh(speedVal);

                    const teamColorVar = teamNum === 1 ? 'var(--team-orange)' : 'var(--team-blue)';

                    activePlayerCardEl.style.setProperty('--active-color', teamColorVar);
                    activePlayerNameEl.textContent = (activePlayer.Name || activePlayer.name || '-').toUpperCase();
                    fitText(activePlayerNameEl, 28, 16);
                    activePlayerTeamTagEl.textContent = teamNum === 1
                        ? (orangeNameEl ? orangeNameEl.textContent : 'NARANJA')
                        : (blueNameEl ? blueNameEl.textContent : 'AZUL');
                    activePlayerTeamTagEl.style.backgroundColor = teamColorVar;
                    fitText(activePlayerTeamTagEl, 13, 10);

                    apScoreEl.textContent = activePlayer.Score !== undefined ? activePlayer.Score : 0;
                    apGoalsEl.textContent = activePlayer.Goals !== undefined ? activePlayer.Goals : 0;
                    apAssistsEl.textContent = activePlayer.Assists !== undefined ? activePlayer.Assists : 0;
                    apSavesEl.textContent = activePlayer.Saves !== undefined ? activePlayer.Saves : 0;
                    apShotsEl.textContent = activePlayer.Shots !== undefined ? activePlayer.Shots : 0;
                    activePlayerCardEl.classList.add('visible');

                    const gp = data.GamepadInput || activePlayer.GamepadInput;
                    if (gp) {
                        gamepadHudEl.classList.add('active');
                        if (gpSteerEl) gpSteerEl.style.width = `${Math.min(100, Math.max(0, (gp.Steer || 0) + 50))}%`;
                        if (gpThrottleEl) gpThrottleEl.style.width = `${Math.min(100, Math.max(0, (gp.Throttle || 0) + 50))}%`;
                        if (gpBoostEl) gpBoostEl.classList.toggle('pressed', !!gp.BoostButton);
                        if (gpJumpEl) gpJumpEl.classList.toggle('pressed', !!gp.JumpButton);
                    } else {
                        gamepadHudEl.classList.remove('active');
                    }

                    boostNumBigEl.textContent = `${boost}`;
                    speedTextEl.textContent = `${speedKmh} KM/H`;

                    const offset = RING_CIRCUMFERENCE * (1 - boost / 100);
                    ringFillEl.style.strokeDashoffset = `${offset}`;

                    if (boost <= 20) {
                        ringFillEl.style.stroke = '#ef4444';
                    } else if (boost >= 100) {
                        ringFillEl.style.stroke = '#facc15';
                    } else {
                        ringFillEl.style.stroke = '#00f0ff';
                    }

                    if (speedKmh >= 80) {
                        boostMeterContainerEl.classList.add('supersonic');
                    } else {
                        boostMeterContainerEl.classList.remove('supersonic');
                    }

                    boostMeterContainerEl.classList.add('visible');
                }
            }
        }

        (async () => {
            try {
                const cfg = await eel.get_team_config()();
                applyTeamConfig(cfg);
            } catch (err) {
                console.error("Error al cargar configuración de equipos:", err);
            }
            try {
                const seriesCfg = await eel.get_series_config()();
                applySeriesConfig(seriesCfg);
            } catch (err) {
                console.error("Error al cargar configuración de la serie:", err);
            }
        })();

        setInterval(() => {
            const ws = eel._websocket;
            if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
                location.reload();
            }
        }, 5000);
    </script>
</body>

</html>
